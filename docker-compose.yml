# Full local stack: PostgreSQL, Redis and the app (API + built client on one port).
#   docker compose up --build              everything, then open http://localhost:4000
#   docker compose exec app npm run db:seed   demo accounts and readings
#   docker compose up db                   only PostgreSQL, for running the app with npm run dev
# Values come from .env when present (copy .env.example), otherwise from the defaults below.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweety}
      POSTGRES_DB: ${POSTGRES_DB:-sweety}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sweety} -d ${POSTGRES_DB:-sweety}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:4000
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      DATABASE_URL: postgres://${POSTGRES_USER:-sweety}:${POSTGRES_PASSWORD:-sweety}@db:5432/${POSTGRES_DB:-sweety}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-of-at-least-32-characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # Plain http on localhost, so the cookie cannot be Secure here. Set true behind HTTPS.
      COOKIE_SECURE: 'false'
      REPORT_CACHE_TTL_SECONDS: ${REPORT_CACHE_TTL_SECONDS:-300}
      REMINDER_CRON: ${REMINDER_CRON:-0 20 * * *}
    ports:
      - '4000:4000'
    command: sh -c "npm run db:migrate && npm start"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
